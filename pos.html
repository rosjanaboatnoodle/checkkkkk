<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>POS ก๋วยเตี๋ยวเรือรสจนา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;600&family=Noto+Sans+Lao:wght@400;600&display=swap" rel="stylesheet" />
<script src="qrcode.js"></script>
<style>
:root{--o:#ea580c;--bd:#e5e7eb;--tx:#1f2937;--mu:#6b7280;--g:#16a34a;--r:#dc2626;--bg:#f1f1f1}
*{box-sizing:border-box;font-family:'Sarabun','Noto Sans Myanmar','Noto Sans Lao',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-size:16px}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;background:#fff;color:var(--tx);border:1px solid var(--bd)}
button.p{background:var(--o);color:#fff;border-color:var(--o);font-weight:600}
button.g{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
button.d{color:var(--r);border-color:#fecaca}
button.sm{padding:5px 10px;border-radius:8px;font-size:14px}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;width:100%;background:#fff}
input[type=checkbox],input[type=radio]{width:20px;height:20px;flex:none}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
label.ck{display:flex;align-items:center;gap:10px;font-size:16px;color:inherit;margin:0;padding:8px 2px;border-bottom:1px solid #f3f4f6}
label.ck span{flex:1}
h1,h2,h3{margin:0}
.top{background:#fff;padding:8px 10px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--bd)}
.step{display:flex;gap:4px;background:#e8f3ee;border-radius:16px;padding:4px;overflow-x:auto;flex:1}
.step button{border:0;background:transparent;border-radius:12px;padding:4px 6px;min-width:66px;flex:1;position:relative;line-height:1.15}
.step button b{display:block;font-size:20px}
.step button small{font-size:13px;white-space:nowrap}
.step button.on{background:var(--c)}
.step i{position:absolute;top:2px;right:4px;font-style:normal;font-size:12px;min-width:20px;height:20px;line-height:20px;border-radius:99px;background:var(--c);text-align:center}
.step button.on i{background:#fff}
.ic{border:0;background:transparent;font-size:22px;padding:6px;position:relative}
.wrap{padding:12px;max-width:1300px;margin:0 auto}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.tbl{background:#fff;border-radius:18px;padding:12px 10px 10px;text-align:center;cursor:pointer;position:relative;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.tbl.busy{background:#fecaca}
.tbl .amt{font-size:22px;font-weight:700;padding:14px 0}
.tbl .nm{background:#f3f4f6;border-radius:99px;padding:6px;font-weight:700;font-size:18px}
.tbl.busy .nm{background:#fff}
.tag{position:absolute;top:-6px;right:-4px;background:var(--r);color:#fff;border-radius:99px;font-size:12px;padding:2px 8px}
.tag.l{right:auto;left:-4px;background:#0284c7}
.split{display:grid;grid-template-columns:1fr 390px;gap:12px;align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chips button{white-space:nowrap;border-radius:99px;padding:7px 14px;border:0;font-weight:600}
.chips button.on{background:#111;color:#fff}
.chips button.has{box-shadow:inset 0 0 0 2px #fca5a5}
.item{background:#fff;border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:80px;justify-content:space-between}
.item.out{opacity:.45;pointer-events:none}
.item .pr{color:var(--o);font-weight:700}
.card{background:#fff;border-radius:16px;padding:14px}
.line{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--bd)}
.line .n{flex:1;min-width:0}
small.th{display:block;font-size:13px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;padding:0;border-radius:8px}
.st{font-size:12px;border-radius:6px;padding:1px 6px;background:#fef3c7;color:#92400e;white-space:nowrap}
.st.cooked{background:#e0f2fe;color:#075985}.st.served{background:#dcfce7;color:#166534}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal{align-items:center}}
.sheet{background:#f8f9fb;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
@media(min-width:600px){.sheet{border-radius:20px}}
.big{display:block;width:100%;padding:20px;font-size:20px;font-weight:700;border:0;border-radius:18px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:99px;z-index:99;font-size:15px;max-width:90vw}
.cartbar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--bd);z-index:30;display:flex;gap:8px}
.cartbar button{flex:1;padding:13px}
.kq{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
.kq h2{font-size:24px}
.ki{display:flex;gap:8px;align-items:stretch;padding:8px 0;border-top:1px solid #f3f4f6}
.ki .n{flex:1;min-width:0;font-size:18px;font-weight:600}
.ki .ops{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ki .ops span{background:#fee2e2;border-radius:8px;padding:2px 10px;font-size:15px;font-weight:500}
.ki button{border:0;border-radius:14px;font-weight:700;min-width:84px;background:var(--c)}
.spk{cursor:pointer;padding:0 6px;color:#0ea5e9}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:7px 6px;border-bottom:1px solid #f3f4f6;text-align:left}
table.t td.r,table.t th.r{text-align:right}
.stat{background:#fff;border-radius:14px;padding:12px}.stat b{font-size:22px;display:block;color:var(--o)}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.qrc{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center;break-inside:avoid}
.qrc svg{width:100%;height:auto}
.mu{color:var(--mu)}.c{text-align:center}.mt{margin-top:12px}
.cu-top{background:var(--o);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.cu-top h1{font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;background:#fff}
  #print.rc{width:72mm;font-size:13px}
  #print.tk .pg{break-after:page;padding-bottom:8mm}
  html,body{background:#fff}
}
</style>
</head>

function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); o.stop(a.currentTime + .2); } catch (e) {} }
function promptpay(id, amount) {
  id = String(id || '').replace(/\D/g, ''); if (!id) return '';
  const f = (k, v) => k + String(v.length).padStart(2, '0') + v;
  const acc = id.length >= 13 ? f('02', id) : f('01', '0066' + id.replace(/^0/, ''));
  let p = f('00', '01') + f('01', amount ? '12' : '11') + f('29', f('00', 'A000000677010111') + acc) + f('53', '764') + (amount ? f('54', amount.toFixed(2)) : '') + f('58', 'TH') + '6304';
  let crc = 0xFFFF;
  for (let i = 0; i < p.length; i++) { crc ^= p.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; }
  return p + crc.toString(16).toUpperCase().padStart(4, '0');
}

/* ===================== ที่เก็บข้อมูลกลาง =====================
   ไม่ใส่ Firebase URL = เก็บในเครื่องนี้ (localStorage)
   ใส่ Firebase Realtime Database URL = ทุกเครื่อง (พนักงาน + ลูกค้า) เห็นข้อมูลชุดเดียวกัน */
function makeStore(db) {
  db = (db || '').trim().replace(/\/+$/, '');
  if (db) {
    const u = p => db + '/rjpos/' + p.split('/').map(encodeURIComponent).join('/') + '.json';
    const j = async (p, o) => { const r = await fetch(u(p), o); if (!r.ok) throw new Error('sync ' + r.status); return r.json(); };
    return {live: true, get: p => j(p), put: (p, v) => j(p, {method: 'PUT', body: JSON.stringify(v)}), del: p => j(p, {method: 'DELETE'})};
  }
  const K = 'rjr_tree', rd = () => { try { return JSON.parse(localStorage.getItem(K)) || {}; } catch (e) { return {}; } };
  const walk = (o, ps, mk) => { for (const p of ps) { if (o[p] == null || typeof o[p] !== 'object') { if (!mk) return null; o[p] = {}; } o = o[p]; } return o; };
  return {live: false,
    async get(p) { const ps = p.split('/'), o = walk(rd(), ps.slice(0, -1)); return o ? o[ps.at(-1)] ?? null : null; },
    async put(p, v) { const t = rd(), ps = p.split('/'); walk(t, ps.slice(0, -1), 1)[ps.at(-1)] = v; localStorage.setItem(K, JSON.stringify(t)); },
    async del(p) { const t = rd(), ps = p.split('/'), o = walk(t, ps.slice(0, -1)); if (o) { delete o[ps.at(-1)]; localStorage.setItem(K, JSON.stringify(t)); } }};
}
function normM(m) {
  m.cats = m.cats || []; m.groups = (m.groups || []).map(g => ({...g, choices: g.choices || []})); m.menu = (m.menu || []).map(x => ({...x, opts: x.opts || []}));
  m.dict = m.dict || {}; m.clangs = m.clangs && m.clangs.length ? m.clangs : ['th', 'en', 'zh']; m.slangs = m.slangs && m.slangs.length ? m.slangs : ['th', 'my', 'lo', 'en'];
  m.tables = Number(m.tables) || 12; return m;
}
function normT(ts) { const o = {}; Object.keys(ts || {}).forEach(k => { const t = ts[k] || {}, it = {}; Object.keys(t.items || {}).forEach(i => { const x = t.items[i]; if (x && x.name) it[i] = {...x, opts: x.opts || [], note: x.note || ''}; }); if (Object.keys(it).length || t.call) o[k] = {openedAt: t.openedAt || Date.now(), call: t.call || '', items: it}; }); return o; }

/* ===================== เมนู (ใช้ร่วมกันทั้งลูกค้าและพนักงาน) ===================== */
function unitPrice(id, opts) {
  const m = M.menu.find(x => x.id === id); if (!m) return null; let p = Number(m.price) || 0;
  m.opts.forEach(gid => { const g = M.groups.find(x => x.id === gid); if (g) g.choices.forEach(c => { if ((opts || []).includes(c.name)) p += Number(c.price) || 0; }); });
  return p;
}
const optLine = x => [...(x.opts || []).map(tr), x.note].filter(Boolean).join(', ');
let PK = null;
function pickItem(id, cb) {
  const m = M.menu.find(x => x.id === id); if (!m || m.out) return; PK = {m, cb, qty: 1};
  const gs = m.opts.map(g => M.groups.find(x => x.id === g)).filter(Boolean);
  modal(`<h2>${esc(tr(m.name))}</h2>${sub(m.name)}<div class="mu">${baht(m.price)}</div>
  ${gs.map(g => `<h3 class="mt">${esc(tr(g.name))} <small class="mu">${g.required ? '(' + tx('req') + ')' : ''}</small></h3>
    ${g.choices.map((c, i) => `<label class="ck"><input type="${g.multi ? 'checkbox' : 'radio'}" name="g_${g.id}" value="${esc(c.name)}" ${!g.multi && g.required && i === 0 ? 'checked' : ''} onchange="pkUpd()"><span>${esc(tr(c.name))}</span><b class="mu">${c.price ? '+' + c.price : ''}</b></label>`).join('')}`).join('')}
  <label>${tx('note')}</label><input id="pkNote">
  <div class="row mt" style="align-items:center"><div class="qty" style="flex:0"><button onclick="pkQty(-1)">−</button><b id="pkQ" style="min-width:28px;text-align:center">1</b><button onclick="pkQty(1)">+</button></div><button class="p" id="pkOk" onclick="pkDone()"></button></div>`);
  pkUpd();
}
function pkOpts() { return [...document.querySelectorAll('#modal input[name^=g_]:checked')].map(e => e.value); }
function pkUpd() { $('#pkOk').textContent = tx('add') + ' ' + baht(unitPrice(PK.m.id, pkOpts()) * PK.qty); $('#pkQ').textContent = PK.qty; }
function pkQty(d) { PK.qty = Math.max(1, PK.qty + d); pkUpd(); }
function pkDone() {
  const o = pkOpts();
  for (const gid of PK.m.opts) { const g = M.groups.find(x => x.id === gid); if (g && g.required && !g.choices.some(c => o.includes(c.name))) return toast(tx('choose') + ' ' + tr(g.name)); }
  const k = PK, m = k.m; const line = {id: m.id, name: m.name, cat: m.cat, price: unitPrice(m.id, o), qty: k.qty, opts: o, note: $('#pkNote').value.trim().slice(0, 100)}; modal(); k.cb(line);
}
function menuGrid(cat, fn) {
  return `<div class="chips"><button class="${!cat ? 'on' : ''}" onclick="${fn}Cat(-1)">${tx('all')}</button>${M.cats.map((c, i) => `<button class="${c === cat ? 'on' : ''}" onclick="${fn}Cat(${i})">${esc(tr(c))}</button>`).join('')}</div>
  <div class="grid">${M.menu.filter(m => !cat || m.cat === cat).map(m => `<div class="item ${m.out ? 'out' : ''}" onclick="${fn}Pick('${m.id}')"><div><b>${esc(tr(m.name))}</b>${sub(m.name)}</div><span class="pr">${m.out ? tx('out') : baht(m.price)}</span></div>`).join('')}</div>`;
}
function addLine(list, line) { const s = list.find(x => x.id === line.id && x.note === line.note && x.opts.join() === line.opts.join()); if (s) s.qty += line.qty; else list.push(line); }

const C = {cat: '', cart: [], mine: null, err: '', T: ''};
function cuSave() { sessionStorage.setItem('rjc_cart_' + C.T, JSON.stringify(C.cart)); }
function cuCat(i) { C.cat = i < 0 ? '' : M.cats[i]; cuDraw(); }
function cuPick(id) { pickItem(id, line => { addLine(C.cart, line); cuSave(); cuDraw(); }); }
function cuQty(i, d) { C.cart[i].qty += d; if (C.cart[i].qty <= 0) C.cart.splice(i, 1); cuSave(); cuDraw(); C.cart.length ? cuCart() : modal(); }
function cuCart() { modal(`<h2>${tx('cart')} — ${tName(C.T)}</h2>${C.cart.map((x, i) => `<div class="line"><div class="n"><b>${esc(tr(x.name))}</b><small class="mu th">${esc(optLine(x))}</small><span class="mu">${baht(x.price * x.qty)}</span></div><div class="qty"><button onclick="cuQty(${i},-1)">−</button><b>${x.qty}</b><button onclick="cuQty(${i},1)">+</button></div></div>`).join('')}
  <div class="tot"><span>${tx('total')}</span><span>${baht(sum(C.cart))}</span></div><div class="row"><button onclick="modal()">${tx('more')}</button><button class="p" id="cuSend" onclick="cuSend()">${tx('send')}</button></div>`); }
async function cuSend() {
  $('#cuSend').disabled = true; const now = Date.now(), base = 'live/tables/' + C.T;
  try {
    if (!(await store.get(base + '/openedAt'))) await store.put(base + '/openedAt', now);
    for (const x of C.cart) await store.put(base + '/items/i' + uid(), {...x, status: 'new', src: 'qr', by: '', at: now});
    await store.put('live/events/e' + uid(), {type: 'order', t: C.T, at: now, dev: 'cust', by: '', n: C.cart.length, items: C.cart.map(x => ({name: x.name, qty: x.qty}))});
    C.cart = []; cuSave(); modal(); toast(tx('sentOk') + ' ✔'); cuDraw(); cuPull();
  } catch (e) { $('#cuSend').disabled = false; toast(tx('fail')); }
}
async function cuCall(kind) { try { await store.put('live/tables/' + C.T + '/call', kind); await store.put('live/events/e' + uid(), {type: 'call', call: kind, t: C.T, at: Date.now(), dev: 'cust', by: ''}); modal(); toast(tx('called')); } catch (e) { toast(tx('fail')); } }

  modal(`<h2>${tx('sent')}</h2>${it.map(x => `<div class="line"><div class="n"><b>${x.qty}× ${esc(tr(x.name))}</b><small class="mu th">${esc(optLine(x))}</small></div><span class="st ${x.status}">${tx(sk[x.status] || 'stNew')}</span><b>${baht(x.price * x.qty)}</b></div>`).join('') || `<p class="mu">${tx('empty')}</p>`}
  <div class="tot"><span>${tx('total')}</span><span>${baht(sum(it))}</span></div><div class="row"><button onclick="cuCall('staff')">🔔 ${tx('callStaff')}</button><button class="p" onclick="cuCall('bill')">💵 ${tx('bill')}</button></div>`); }
function cuLang() { modal(`<h2>🌐 ${tx('lang')}</h2>${M.clangs.map(l => `<button class="big" style="background:${l === UL ? '#fed7aa' : '#fff'}" onclick="cuSetLang('${l}')">${LANGS[l][0]}</button>`).join('')}`); }
function cuSetLang(l) { UL = l; localStorage.setItem('rjc_lang', l); document.documentElement.lang = l; modal(); cuDraw(); }
function cuDraw() {
  if (!M) { $('#app').innerHTML = `<div class="wrap c mu" style="padding-top:80px">${C.err || tx('loading')}</div>`; return; }
  const n = C.cart.reduce((s, x) => s + x.qty, 0), mn = Object.keys((C.mine || {}).items || {}).length;

    <div class="wrap" style="padding-bottom:90px">${menuGrid(C.cat, 'cu')}</div>
    <div class="cartbar"><button onclick="cuMine()">📋 ${tx('sent')}${mn ? ' (' + mn + ')' : ''}</button><button class="p" ${n ? '' : 'disabled'} onclick="cuCart()">🛒 ${tx('cart')} ${n ? n + ' • ' + baht(sum(C.cart)) : ''}</button></div>`;
}
let cuMv = 0;
async function cuPull() {
  try {
    const mv = await store.get('live/mv');
    if (!M || mv !== cuMv) { const raw = await store.get('menu'); if (raw) { M = normM(JSON.parse(raw)); cuMv = mv; if (!M.clangs.includes(UL)) UL = M.clangs[0]; if (!$('#modal').innerHTML) cuDraw(); } else C.err = tx('closed'); }
    if (M && (C.T !== 't0' && !(+C.T.slice(1) >= 1 && +C.T.slice(1) <= M.tables))) { M = null; C.err = tx('closed'); }
    const m = normT({x: await store.get('live/tables/' + C.T)}).x || null; if (JSON.stringify(m) !== JSON.stringify(C.mine)) { C.mine = m; if (!$('#modal').innerHTML) cuDraw(); }
  } catch (e) { if (!M) C.err = tx('fail'); }
  if (!M) cuDraw();
}
function custInit() {
  C.T = 't' + (parseInt(Q.get('t')) || 0); FB = true; UL = localStorage.getItem('rjc_lang') || 'th'; if (!LANGS[UL]) UL = 'th';

  cuDraw(); cuPull(); setInterval(cuPull, 5000);
}

let D = Object.assign({id: 'd' + uid(), name: 'Staff', lang: 'th', db: '', voice: true, vlang: '', say: {order: 1, cooked: 1, served: 0, call: 1, paid: 1}, autoPrint: false, pcats: [], plang: '', pth: true, paper: 80, kcat: ''}, (() => { try { return JSON.parse(localStorage.getItem('rj_dev')) || {}; } catch (e) { return {}; } })());
const saveD = () => localStorage.setItem('rj_dev', JSON.stringify(D));
let L = {}, SALES = [], pending = 0, seq = 0, syncErr = '', seen = null, P = null;
const V = {tab: 'tables', table: null, cat: '', day: dayKey(Date.now()), draft: {}, log: [], set: 'dev', trl: ''};
async function W(p) { pending++; seq++; try { await p; syncErr = ''; } catch (e) { syncErr = e.message; toast('⚠️ ' + tx('fail')); } finally { pending--; } }
function saveM() { M.v = Date.now(); W(store.put('menu', JSON.stringify(M))); W(store.put('live/mv', M.v)); }
const tableIds = () => [...Array.from({length: M.tables}, (_, i) => 't' + (i + 1)), 't0'];
const itemsOf = tb => Object.entries((L[tb] || {}).items || {}).map(([k, x]) => ({k, ...x})).sort((a, b) => a.at - b.at);
const vl = () => speakLang(D.vlang || D.lang);

/* ---------- เหตุการณ์ + เสียงประกาศข้ามเครื่อง ---------- */
function evText(e, l) {
  const tn = tNameL(e.t, l), names = (e.items || []).slice(0, 4).map(x => trL(x.name, l) + (x.qty > 1 ? ' ' + x.qty : '')).join(', ');
  if (e.type === 'order') return fmt(TL('sOrder', l), [tn, e.n]) + ' ' + names;
  if (e.type === 'cooked') return e.all ? fmt(TL('sCookedAll', l), [tn]) : fmt(TL('sCooked', l), [tn, names]);
  if (e.type === 'served') return e.all ? fmt(TL('sServedAll', l), [tn]) : fmt(TL('sServed', l), [tn, names]);
  if (e.type === 'call') return fmt(TL(e.call === 'bill' ? 'sBill' : 'sStaff', l), [tn]);
  if (e.type === 'paid') return e.method === 'cash' ? fmt(TL('sCash', l), [tn, e.net, e.recv, e.chg]) : fmt(TL('sQr', l), [tn, e.net]);
  return '';
}
function announce(e) { V.log.unshift(e); V.log.length = Math.min(V.log.length, 40); if (D.voice && D.say[e.type]) { if (e.dev !== D.id) beep(); const l = vl(); speak(evText(e, l), l); } }
function emit(e) { e = {...e, at: Date.now(), dev: D.id, by: D.name}; const k = 'e' + uid(); if (seen) seen.add(k); announce(e); W(store.put('live/events/' + k, e)); }
function handleEvents(evs) {
  const ks = Object.keys(evs).sort();
  if (!seen) { seen = new Set(ks); return; }
  ks.forEach(k => { if (!seen.has(k)) { seen.add(k); if (evs[k] && evs[k].dev !== D.id) announce(evs[k]); } });
  if (ks.length > 30) ks.forEach(k => { if (evs[k].at < Date.now() - 300000) store.del('live/events/' + k).catch(() => {}); });
}
async function poll() {
  const s = seq; let lv; try { lv = await store.get('live') || {}; syncErr = ''; } catch (e) { syncErr = e.message; return; }
  if (pending || s !== seq) return;
  let ch = false;
  if (lv.mv && lv.mv !== M.v) { try { const raw = await store.get('menu'); if (raw) { M = normM(JSON.parse(raw)); ch = true; } } catch (e) {} }
  const nt = normT(lv.tables); if (JSON.stringify(nt) !== JSON.stringify(L)) { L = nt; ch = true; }
  handleEvents(lv.events || {}); autoPrint();
  if (ch && !['set', 'sales'].includes(V.tab)) draw();
}

/* ---------- พิมพ์ใบครัว ---------- */
const inCats = (x, cats) => !cats || !cats.length || cats.includes(x.cat);
function autoPrint() {
  if (!D.autoPrint) return; const jobs = [];
  Object.keys(L).forEach(tb => { const its = itemsOf(tb).filter(x => x.status === 'new' && !x.pr && inCats(x, D.pcats)); if (its.length) { its.forEach(x => { L[tb].items[x.k].pr = 1; W(store.put(`live/tables/${tb}/items/${x.k}/pr`, 1)); }); jobs.push([tb, its]); } });
  if (jobs.length) printTickets(jobs);
}
function printTickets(jobs) {
  const pl = D.plang || D.lang, el = $('#print'); el.className = 'tk';
  el.innerHTML = jobs.map(([tb, its]) => `<div class="pg" style="width:${D.paper - 8}mm;font-size:${D.paper >= 80 ? 15 : 13}px"><div style="font-size:1.9em;font-weight:700">${esc(tNameL(tb, pl))}</div><div>${new Date(its[0].at).toLocaleString('th-TH')} • ${esc(its[0].src === 'qr' ? TL('cust', pl) : its[0].by || '')}</div><hr>
    ${its.map(x => `<div style="margin:6px 0"><div style="font-size:1.35em;font-weight:700">${x.qty} × ${esc(trL(x.name, pl))}</div>${pl !== 'th' && D.pth ? `<div>${esc(x.name)}</div>` : ''}${x.opts.length ? `<div style="font-size:1.1em">- ${x.opts.map(o => esc(trL(o, pl)) + (pl !== 'th' && D.pth && trL(o, pl) !== o ? ' (' + esc(o) + ')' : '')).join('<br>- ')}</div>` : ''}${x.note ? `<div style="font-weight:700">* ${esc(x.note)}</div>` : ''}</div>`).join('<hr style="border-style:dashed">')}</div>`).join('');
  setTimeout(() => window.print(), 50);
}
function printQueue(tb, st) { const its = itemsOf(tb).filter(x => x.status === st && (st !== 'new' || inCats(x, D.kcat ? [D.kcat] : []))); if (its.length) printTickets([[tb, its]]); }

/* ---------- โครงหน้า ---------- */
function draw() {
  let nNew = 0, nCk = 0; Object.keys(L).forEach(tb => itemsOf(tb).forEach(x => { if (x.status === 'new') nNew++; else if (x.status === 'cooked') nCk++; }));
  const nBill = Object.keys(L).filter(tb => itemsOf(tb).length).length;
  const tabs = [['tables', tx('tables'), 0, '#fecaca'], ['order', tx('orders'), 0, '#fde68a'], ['kitchen', tx('kitchen'), nNew, '#34d399'], ['serve', tx('serve'), nCk, '#7dd3fc'], ['bill', tx('bill'), nBill, '#c7d2fe']];
  $('#app').innerHTML = `<div class="top"><div class="step">${tabs.map((t, i) => `<button style="--c:${t[3]}" class="${V.tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')"><b>${i + 1}</b><small>${t[1]}</small>${t[2] ? `<i>${t[2]}</i>` : ''}</button>`).join('')}</div>
    <button class="ic" title="เสียง" onclick="D.voice=!D.voice;saveD();draw()">${D.voice ? '🔊' : '🔇'}</button><button class="ic" title="ยอดขาย" onclick="go('sales')">🧾</button><button class="ic" title="${tx('log')}" onclick="showLog()">🔔</button><button class="ic" title="ตั้งค่า" onclick="go('set')">⚙️</button></div>
  ${syncErr ? '<div class="c" style="background:#fee2e2;color:#991b1b;padding:4px">⚠️ เชื่อมต่อข้อมูลกลางไม่ได้ (' + esc(syncErr) + ')</div>' : ''}
  <div class="wrap">${({tables: vTables, order: vOrder, kitchen: () => vQueue('new'), serve: () => vQueue('cooked'), bill: vBill, sales: vSales, set: vSet}[V.tab])()}</div>`;
}
function go(t) { V.tab = t; if (t === 'sales') loadSales().then(draw); draw(); window.scrollTo(0, 0); }
function showLog() { modal(`<h2>🔔 ${tx('log')}</h2>${V.log.map(e => `<div class="line"><div class="n">${esc(evText(e, UL))}<small class="mu th">${hm(e.at)} • ${esc(e.dev === 'cust' ? tx('cust') : e.by)}</small></div><span class="spk" onclick="speak(evText(V.log[${V.log.indexOf(e)}],vl()),vl())">🔊</span></div>`).join('') || `<p class="mu">${tx('empty')}</p>`}`); }

/* ---------- 1 โต๊ะ ---------- */
function vTables() {
  const pend = Object.keys(L).reduce((s, tb) => s + sum(itemsOf(tb)), 0);
  return `<b class="mu">${tx('pending')} ${pend.toLocaleString('en-US', {minimumFractionDigits: 2})}</b><div class="grid mt" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${tableIds().map(tb => { const its = itemsOf(tb), o = L[tb], ck = its.filter(x => x.status === 'cooked').length;
    return `<div class="tbl ${its.length ? 'busy' : ''}" onclick="tblTap('${tb}')">${o && o.call ? `<span class="tag">${o.call === 'bill' ? tx('bill') : tx('callStaff')}</span>` : ''}${ck ? `<span class="tag l">${tx('stCooked')} ${ck}</span>` : ''}<div class="amt">${its.length ? sum(its).toLocaleString('en-US', {minimumFractionDigits: 2}) : (tb === 't0' ? '🛍️' : '<span class="mu" style="font-weight:400;font-size:16px">' + tx('free') + '</span>')}</div><div class="nm">${tName(tb)}</div></div>`; }).join('')}</div>`;
}
function tblTap(tb) {

  if (!itemsOf(tb).length) return openOrder(tb);
  modal(`<h1 class="c">${tName(tb)}</h1><button class="big" style="background:#fde68a" onclick="modal();openOrder('${tb}')">${tx('order')}</button><button class="big" style="background:#a7f3d0" onclick="pay('${tb}')">${tx('bill')}</button><button class="big" style="background:#bae6fd" onclick="moveTable('${tb}')">${tx('move')}</button>`);
}
function openOrder(tb) { V.table = tb; V.cat = ''; go('order'); }

/* ---------- 2 ออเดอร์ ---------- */
function poCat(i) { V.cat = i < 0 ? '' : M.cats[i]; draw(); }
function poPick(id) { const m = M.menu.find(x => x.id === id), d = V.draft[V.table] = V.draft[V.table] || []; if (!m.opts.length) { addLine(d, {id, name: m.name, cat: m.cat, price: Number(m.price), qty: 1, opts: [], note: ''}); draw(); } else pickItem(id, line => { addLine(d, line); draw(); }); }
function drQty(i, n) { const d = V.draft[V.table]; d[i].qty += n; if (d[i].qty <= 0) d.splice(i, 1); draw(); }
function ensureTable(tb) { if (!L[tb]) { L[tb] = {openedAt: Date.now(), call: '', items: {}}; W(store.put(`live/tables/${tb}/openedAt`, L[tb].openedAt)); } }
function sendDraft() {
  const tb = V.table, d = V.draft[tb] || []; if (!d.length) return; const now = Date.now(); ensureTable(tb);
  d.forEach(x => { const k = 'i' + uid(), it = {...x, status: 'new', src: 'staff', by: D.name, at: now}; L[tb].items[k] = it; W(store.put(`live/tables/${tb}/items/${k}`, it)); });
  emit({type: 'order', t: tb, n: d.length, items: d.map(x => ({name: x.name, qty: x.qty}))}); V.draft[tb] = []; toast(tx('sentOk') + ' ✔'); autoPrint(); draw();
}
function delItem(tb, k) { if (!confirm(tx('del'))) return; delete L[tb].items[k]; if (Object.keys(L[tb].items).length) W(store.del(`live/tables/${tb}/items/${k}`)); else { delete L[tb]; W(store.del('live/tables/' + tb)); } draw(); }
function vOrder() {
  const tb = V.table, chips = `<div class="chips">${tableIds().map(x => `<button class="${x === tb ? 'on' : ''} ${itemsOf(x).length ? 'has' : ''}" onclick="openOrder('${x}')">${tName(x)}</button>`).join('')}</div>`;
  if (!tb) return chips + `<p class="mu c">${tx('pickTable')}</p>`;
  const d = V.draft[tb] || [], its = itemsOf(tb), sk = {new: 'stNew', cooked: 'stCooked', served: 'stServed'};
  return chips + `<div class="split"><div>${menuGrid(V.cat, 'po')}</div><div class="card" style="position:sticky;top:70px"><h3>${tName(tb)}</h3>
    ${d.length ? `<b class="mu">${tx('draft')}</b>${d.map((x, i) => `<div class="line"><div class="n"><b>${esc(tr(x.name))}</b>${sub(x.name)}<small class="mu th">${esc(optLine(x))}</small></div><div class="qty"><button onclick="drQty(${i},-1)">−</button><b>${x.qty}</b><button onclick="drQty(${i},1)">+</button></div><b style="min-width:52px;text-align:right">${baht(x.price * x.qty)}</b></div>`).join('')}
    <button class="p mt" style="width:100%;padding:14px;font-size:18px" onclick="sendDraft()">${tx('send')} ${baht(sum(d))}</button>` : ''}
    ${its.length ? `<div class="mt"><b class="mu">${tx('sent')}</b></div>${its.map(x => `<div class="line"><div class="n"><b>${x.qty}× ${esc(tr(x.name))}</b><span class="spk" onclick="readItem('${tb}','${x.k}')">🔊</span><small class="mu th">${esc(optLine(x))}</small><span class="st ${x.status}">${tx(sk[x.status])}</span>${x.src === 'qr' ? ' 📱' : ''}</div><b>${baht(x.price * x.qty)}</b><button class="sm d" onclick="delItem('${tb}','${x.k}')">✕</button></div>`).join('')}
    <div class="tot"><span>${tx('total')}</span><span>${baht(sum(its))}</span></div>
    <div class="row"><button onclick="printBill('${tb}')">🖨️ ${tx('billSlip')}</button><button onclick="moveTable('${tb}')">⇄ ${tx('move')}</button></div>
    <button class="g mt" style="width:100%;padding:14px;font-size:18px" onclick="pay('${tb}')">💵 ${tx('pay')} ${baht(sum(its))}</button>` : (d.length ? '' : `<p class="mu">${tx('empty')}</p>`)}</div></div>`;
}
function readItem(tb, k) { const x = L[tb].items[k], l = vl(); speak([x.qty, trL(x.name, l), ...x.opts.map(o => trL(o, l)), x.note].filter(Boolean).join(' '), l); }
function moveTable(from) { modal(`<h2>${tx('move')} — ${tName(from)}</h2><div class="grid mt">${tableIds().filter(t => t !== from).map(t => `<button onclick="doMove('${from}','${t}')">${tName(t)}${itemsOf(t).length ? ' •' : ''}</button>`).join('')}</div>`); }
function doMove(from, to) { ensureTable(to); Object.entries(L[from].items).forEach(([k, x]) => { L[to].items[k] = x; W(store.put(`live/tables/${to}/items/${k}`, x)); }); delete L[from]; W(store.del('live/tables/' + from)); if (V.draft[from]) { V.draft[to] = V.draft[from]; delete V.draft[from]; } modal(); if (V.table === from) V.table = to; draw(); }

/* ---------- 3 ครัว / 4 เสิร์ฟ ---------- */
function setKcat(i) { D.kcat = i < 0 ? '' : M.cats[i]; saveD(); draw(); }
function vQueue(st) {
  const kit = st === 'new', col = kit ? '#34d399' : '#7dd3fc', f = x => x.status === st && (!kit || inCats(x, D.kcat ? [D.kcat] : []));
  const tbs = Object.keys(L).map(tb => [tb, itemsOf(tb).filter(f)]).filter(x => x[1].length).sort((a, b) => a[1][0].at - b[1][0].at);
  return (kit ? `<div class="chips"><button class="${!D.kcat ? 'on' : ''}" onclick="setKcat(-1)">${tx('all')}</button>${M.cats.map((c, i) => `<button class="${c === D.kcat ? 'on' : ''}" onclick="setKcat(${i})">${esc(tr(c))}</button>`).join('')}</div>` : '') +
  (tbs.length ? `<div class="kq">${tbs.map(([tb, its]) => `<div class="card"><div class="row" style="align-items:center"><h2>${tName(tb)}</h2><button class="sm" style="flex:0;white-space:nowrap" onclick="advAll('${tb}','${st}')">${tx('doneAll')}</button>${kit ? `<button class="sm" style="flex:0" onclick="printQueue('${tb}','${st}')">🖨️</button>` : ''}</div>
    <div style="color:var(--r);font-weight:600">${its.length} ${tx('items')} ${tx('by')} ${esc(its[0].src === 'qr' ? tx('cust') : its[0].by)}</div><div class="mu">${new Date(its[0].at).toLocaleString('th-TH')}</div>
    ${its.map(x => `<div class="ki"><div class="n">x ${x.qty} ${esc(tr(x.name))}<span class="spk" onclick="readItem('${tb}','${x.k}')">🔊</span>${sub(x.name)}<div class="ops">${x.opts.map(o => `<span>${esc(tr(o))}</span>`).join('')}${x.note ? `<span style="background:#fef08a">✎ ${esc(x.note)}</span>` : ''}</div></div><button style="--c:${col}" onclick="adv('${tb}','${x.k}')">${tx('done')}</button></div>`).join('')}</div>`).join('')}</div>` : `<p class="mu c" style="padding:40px">${tx('empty')} 🎉</p>`);
}
const nextSt = s => s === 'new' ? 'cooked' : 'served';
function setSt(tb, k, s) { L[tb].items[k].status = s; W(store.put(`live/tables/${tb}/items/${k}/status`, s)); }
function adv(tb, k) { const x = L[tb].items[k], n = nextSt(x.status); setSt(tb, k, n); emit({type: n, t: tb, items: [{name: x.name, qty: x.qty}]}); draw(); }
function advAll(tb, st) { const its = itemsOf(tb).filter(x => x.status === st && (st !== 'new' || inCats(x, D.kcat ? [D.kcat] : []))); its.forEach(x => setSt(tb, x.k, nextSt(st))); emit({type: nextSt(st), t: tb, all: its.length > 1, items: its.map(x => ({name: x.name, qty: x.qty}))}); draw(); }

/* ---------- 5 เช็คบิล ---------- */
function vBill() { const tbs = Object.keys(L).filter(tb => itemsOf(tb).length); return tbs.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${tbs.map(tb => `<button class="big" style="margin:0;background:#fff;display:flex;justify-content:space-between" onclick="pay('${tb}')"><span>${tName(tb)}${L[tb].call === 'bill' ? ' 🔔' : ''}</span><span style="color:var(--o)">${baht(sum(itemsOf(tb)))}</span></button>`).join('')}</div>` : `<p class="mu c" style="padding:40px">${tx('empty')}</p>`; }
function pay(tb) { P = {tb, disc: 0, recv: 0, method: 'cash'}; payDraw(); }
function payDraw() {
  const total = sum(itemsOf(P.tb)), net = Math.max(0, total - P.disc), pp = promptpay(M.promptpay, net);
  const quick = [...new Set([net, Math.ceil(net / 20) * 20, Math.ceil(net / 50) * 50, Math.ceil(net / 100) * 100, Math.ceil(net / 500) * 500, Math.ceil(net / 1000) * 1000])].filter(v => v > 0);
  modal(`<h2>${tx('pay')} — ${tName(P.tb)}</h2>
  <div class="row" style="align-items:end"><div><label>${tx('total')}</label><b style="font-size:20px">${baht(total)}</b></div><div><label>${tx('disc')}</label><input type="number" inputmode="decimal" min="0" value="${P.disc || ''}" onchange="P.disc=Math.max(0,+this.value||0);payDraw()"></div></div>
  <div class="tot"><span>${tx('net')}</span><span style="color:var(--o)">${baht(net)}</span></div>
  <div class="chips"><button class="${P.method === 'cash' ? 'on' : ''}" onclick="P.method='cash';payDraw()">${tx('cash')}</button><button class="${P.method === 'qr' ? 'on' : ''}" onclick="P.method='qr';payDraw()">${tx('qr')}</button></div>
  ${P.method === 'cash' ? `<label>${tx('recv')}</label><input id="recv" type="number" inputmode="decimal" value="${P.recv || ''}" oninput="P.recv=+this.value||0;payChg()"><div class="row mt">${quick.map(v => `<button class="sm" onclick="P.recv=${v};payDraw()">${v.toLocaleString()}</button>`).join('')}</div><div class="tot"><span>${tx('change')}</span><span id="chg"></span></div>`
  : (pp ? `<div class="c" style="max-width:240px;margin:0 auto">${qrSvg(pp)}</div><p class="c mu">PromptPay ${esc(M.promptpay)} • ${baht(net)}</p>` : '')}
  <div class="row mt"><button onclick="modal()">${tx('cancel')}</button><button class="g" id="payOk" onclick="payDone(false)">${tx('confirm')}</button><button class="g" id="payOk2" onclick="payDone(true)">${tx('confirmPrint')}</button></div>`);
  if (P.method === 'cash') payChg();
}
function payChg() { const net = Math.max(0, sum(itemsOf(P.tb)) - P.disc), ok = P.recv >= net; $('#chg').textContent = ok ? baht(P.recv - net) : '—'; $('#payOk').disabled = $('#payOk2').disabled = !ok; }
function payDone(pr) {
  const its = itemsOf(P.tb), total = sum(its), net = Math.max(0, total - P.disc), now = Date.now();
  const s = {id: 's' + uid(), no: SALES.filter(x => dayKey(x.at) === dayKey(now)).length + 1, at: now, table: P.tb, by: D.name, items: its.map(({name, price, qty, opts, note}) => ({name, price, qty, opts, note})), total, disc: P.disc, net, method: P.method, recv: P.method === 'cash' ? P.recv : net};
  SALES.push(s); W(store.put('sales/' + s.id, JSON.stringify(s))); delete L[P.tb]; W(store.del('live/tables/' + P.tb)); delete V.draft[P.tb];
  emit({type: 'paid', t: P.tb, method: s.method, net, recv: s.recv, chg: s.recv - net}); modal(); if (pr) receipt(s, true);
  toast(tx('change') + ' ' + baht(s.recv - net)); if (V.table === P.tb) V.table = null; V.tab = 'tables'; draw();
}
function receipt(s, paid) {
  const el = $('#print'); el.className = 'rc', ol = x => [...(x.opts || []), x.note].filter(Boolean).join(', ');
  el.innerHTML = `<div style="text-align:center"><b style="font-size:16px">${esc(M.shop)}</b><br>${paid ? 'ใบเสร็จรับเงิน #' + s.no : 'ใบแจ้งรายการ'}<br>${tNameL(s.table, 'th')} • ${new Date(s.at).toLocaleString('th-TH')}</div><hr>

function editCats() { modal(`<h2>หมวดหมู่</h2><label>หนึ่งบรรทัดต่อหนึ่งหมวด (เรียงตามลำดับที่แสดง)</label><textarea id="eCats" rows="7">${esc(M.cats.join('\n'))}</textarea><div class="row mt"><button onclick="modal()">ยกเลิก</button><button class="p" onclick="saveCats()">บันทึก</button></div>`); }
function saveCats() { const c = [...new Set($('#eCats').value.split('\n').map(s => s.trim()).filter(Boolean))]; M.menu.forEach(m => { if (!c.includes(m.cat)) c.push(m.cat); }); M.cats = c; saveM(); modal(); draw(); }
function editGroup(id) {
  const g = M.groups.find(x => x.id === id) || {name: '', required: false, multi: false, choices: []};
  modal(`<h2>${id ? 'แก้ไข' : 'เพิ่ม'}กลุ่มตัวเลือก</h2><label>ชื่อกลุ่ม (ภาษาไทย)</label><input id="gN" value="${esc(g.name)}">
  <label class="ck"><input type="checkbox" id="gR" ${g.required ? 'checked' : ''}><span>ต้องเลือก</span></label><label class="ck"><input type="checkbox" id="gM" ${g.multi ? 'checked' : ''}><span>เลือกได้หลายอย่าง</span></label>
  <label>ตัวเลือก — บรรทัดละ 1 อย่าง, ใส่ราคาเพิ่มด้วย =  เช่น  พิเศษ=10</label><textarea id="gC" rows="7">${esc(g.choices.map(c => c.name + (c.price ? '=' + c.price : '')).join('\n'))}</textarea>
  <div class="row mt">${id ? `<button class="d" onclick="delGroup('${id}')">ลบ</button>` : ''}<button onclick="modal()">ยกเลิก</button><button class="p" onclick="saveGroup('${id || ''}')">บันทึก</button></div>`);
}
function saveGroup(id) {
  const name = $('#gN').value.trim(), choices = $('#gC').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [n, p] = l.split('='); return {name: n.trim(), price: +p || 0}; });
  if (!name || !choices.length) return toast('กรอกชื่อและตัวเลือก');
  const v = {name, choices, required: $('#gR').checked, multi: $('#gM').checked};
  if (id) Object.assign(M.groups.find(x => x.id === id), v); else M.groups.push({id: 'g' + uid(), ...v}); saveM(); modal(); draw();
}
function delGroup(id) { if (confirm('ลบกลุ่มนี้?')) { M.groups = M.groups.filter(g => g.id !== id); M.menu.forEach(m => m.opts = m.opts.filter(o => o !== id)); saveM(); modal(); draw(); } }

async function staffInit() {
  if (Q.get('db')) { D.db = Q.get('db'); history.replaceState(null, '', location.pathname); }
  saveD(); UL = LANGS[D.lang] ? D.lang : 'th'; document.documentElement.lang = UL; store = makeStore(D.db);
  try { const raw = await store.get('menu'); if (raw) M = normM(JSON.parse(raw)); }
  catch (e) { syncErr = e.message; M = normM(clone(DEF)); }
  if (!M) { M = normM(clone(DEF)); saveM(); }
  draw(); loadSales(); await poll(); setInterval(poll, store.live ? 2500 : 1500);
  window.addEventListener('storage', e => { if (e.key === 'rjr_tree') poll(); });
}
Q.get('t') ? custInit() : staffInit();
</script>
